<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Panel de administración de Electro Mundo.">
  <title>Panel | Electro Mundo</title>
  <link rel="icon" href="img/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{if(localStorage.getItem("electromundo-theme")==="dark")document.documentElement.classList.add("dark-theme")}catch(e){}</script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html" aria-label="Electro Mundo - Inicio">
        <img src="img/logo.webp" alt="" onerror="this.style.display='none'">
        <span>Electro <strong>Mundo</strong> <small style="font-weight:600;font-size:12px;color:#8da0c0;margin-left:4px">PANEL</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación del panel">
        <a href="index.html">Ver tienda</a>
        <a href="cuenta.html">Mi cuenta</a>
      </nav>
      <div class="header-actions">
        <button class="btn-tema" id="theme-toggle" type="button" aria-label="Cambiar tema"><svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="label">Tema</span></button>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="container adm">
    <p id="deny" class="panel" hidden>Esta sección es solo para administradores. <a href="cuenta.html">Iniciar sesión</a></p>
    <div id="app" hidden>
      <h1>Panel de administración</h1>
      <div class="stats" id="stats"></div>
      <h2>Mensajes de contacto</h2>
      <div class="filters" id="f-msg"></div>
      <div class="tbl"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Correo</th><th>Mensaje</th><th>Estado</th></tr></thead><tbody id="t-msg"></tbody></table></div>
      <h2>Pedidos</h2>
      <div class="tbl"><table><thead><tr><th>#</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Estado</th></tr></thead><tbody id="t-ord"></tbody></table></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const db = window.supabaseClient, $ = (s) => document.querySelector(s);
    const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const MSG = { nuevo:"Nuevo", en_curso:"En curso", atendido:"Atendido" };
    const ORD = { pendiente:"Pendiente", en_proceso:"En proceso", enviado:"Enviado", entregado:"Entregado", cancelado:"Cancelado" };
    const fecha = (d) => new Date(d).toLocaleString("es-PE", { dateStyle: "short", timeStyle: "short" });
    const opts = (map, cur) => Object.entries(map).map(([k, v]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${v}</option>`).join("");
    let msgs = [], filtro = "todos";

    async function init() {
      const { data } = await db.auth.getSession(), u = data.session?.user;
      const { data: p } = u ? await db.from("perfiles").select("rol").eq("id", u.id).maybeSingle() : {};
      if (p?.rol !== "admin") return ($("#deny").hidden = false);
      $("#app").hidden = false;
      await Promise.all([loadMsgs(), loadOrders(), loadStats()]);
    }
    async function loadStats() {
      const [{ data: m }, { data: o }, { count }] = await Promise.all([
        db.from("mensajes_contacto").select("estado"),
        db.from("pedidos").select("total,estado"),
        db.from("productos").select("*", { count: "exact", head: true })
      ]);
      const ventas = (o || []).filter((x) => x.estado !== "cancelado").reduce((s, x) => s + Number(x.total), 0);
      const card = (n, l, c = "") => `<div class="stat ${c}"><strong>${n}</strong><span>${l}</span></div>`;
      $("#stats").innerHTML =
        card((m || []).filter((x) => x.estado === "nuevo").length, "Mensajes nuevos", "st-nuevo") +
        card((o || []).filter((x) => x.estado === "pendiente").length, "Pedidos pendientes", "st-pendiente") +
        card("S/ " + ventas.toFixed(2), "Ventas (sin cancelados)") + card(count ?? 0, "Productos");
    }
    async function loadMsgs() {
      const { data } = await db.from("mensajes_contacto").select("*").order("created_at", { ascending: false });
      msgs = data || []; drawMsgs();
    }
    function drawMsgs() {
      $("#f-msg").innerHTML = ["todos", ...Object.keys(MSG)].map((k) =>
        `<button class="tab ${k === filtro ? "on" : ""}" data-f="${k}">${k === "todos" ? "Todos" : MSG[k]}</button>`).join("");
      $("#f-msg").querySelectorAll("button").forEach((b) => b.onclick = () => { filtro = b.dataset.f; drawMsgs(); });
      const rows = msgs.filter((m) => filtro === "todos" || m.estado === filtro);
      $("#t-msg").innerHTML = rows.length ? rows.map((m) => `<tr class="row-${m.estado}"><td>${fecha(m.created_at)}</td>
        <td>${esc(m.nombre)}</td><td><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></td><td>${esc(m.mensaje) || "—"}</td>
        <td><select class="sel st-${m.estado}" data-id="${m.id}" data-t="mensajes_contacto">${opts(MSG, m.estado)}</select></td></tr>`).join("")
        : '<tr><td colspan="5" class="muted">No hay mensajes en este estado.</td></tr>';
    }
    async function loadOrders() {
      const { data } = await db.from("pedidos").select("*").order("created_at", { ascending: false });
      $("#t-ord").innerHTML = (data || []).length ? data.map((o) => `<tr><td>${o.id}</td><td>${fecha(o.created_at)}</td>
        <td>${o.items.map((i) => esc(i.name) + " ×" + i.qty).join("<br>")}</td><td>S/ ${Number(o.total).toFixed(2)}</td>
        <td><select class="sel st-${o.estado}" data-id="${o.id}" data-t="pedidos">${opts(ORD, o.estado)}</select></td></tr>`).join("")
        : '<tr><td colspan="5" class="muted">Todavía no hay pedidos.</td></tr>';
    }
    document.addEventListener("change", async (e) => {
      const s = e.target.closest(".sel"); if (!s) return;
      const { error } = await db.from(s.dataset.t).update({ estado: s.value }).eq("id", s.dataset.id);
      if (error) return alert("No se pudo guardar el cambio.");
      s.className = "sel st-" + s.value;
      if (s.dataset.t === "mensajes_contacto") { const m = msgs.find((x) => x.id == s.dataset.id); if (m) m.estado = s.value; drawMsgs(); }
      loadStats();
    });
    db ? init() : ($("#deny").hidden = false);
  </script>
</body>
</html>
